name: Upstream template check
# Once a week, look for work in the upstream template that this starter has
# not merged yet: a new release/* branch (one per Hermes Agent version) or
# new commits on its main. When there is some, open one issue (or update the
# open one) with the branches and the merge steps. Nothing is merged
# automatically.
on:
  schedule:
    - cron: '41 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
env:
  UPSTREAM: https://github.com/praveen-ks-2001/hermes-agent-template
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Compare with the upstream template
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          git fetch --quiet --no-tags "$UPSTREAM" \
            '+refs/heads/main:refs/remotes/upstream/main' \
            '+refs/heads/release/*:refs/remotes/upstream/release/*'
          pinned=$(sed -n 's/^ARG HERMES_REF=\(v[0-9][0-9.]*\)$/\1/p' Dockerfile | head -n 1)
          [ -n "$pinned" ] || { echo "could not read HERMES_REF from the Dockerfile"; exit 1; }
          missing=""
          for ref in $(git for-each-ref --format='%(refname:short)' refs/remotes/upstream/release); do
            name=${ref#upstream/}
            # Branch names come from outside; only the expected shape goes
            # into the issue.
            case "$name" in
              release/v[0-9]*) ;;
              *) echo "skipping unexpected branch name"; continue ;;
            esac
            [ -z "$(printf '%s' "$name" | tr -d 'a-z0-9./-')" ] || { echo "skipping unexpected branch name"; continue; }
            git merge-base --is-ancestor "$ref" HEAD || missing="$missing $name"
          done
          main_behind=$(git rev-list --count HEAD..upstream/main)
          echo "pinned: $pinned; unmerged release branches:${missing:- none}; upstream main commits not here: $main_behind"
          if [ -z "$missing" ] && [ "$main_behind" -eq 0 ]; then
            echo "up to date"
            exit 0
          fi
          list=""
          for name in $missing; do
            list="${list}- \`${name}\`: ${UPSTREAM}/tree/${name}
          "
          done
          [ -n "$list" ] || list="- none
          "
          title="Upstream template moved (this starter pins Hermes ${pinned})"
          body=$(cat <<BODY
          The upstream template has work this starter has not merged yet.

          Release branches not merged here:
          ${list}
          Commits on upstream \`main\` not merged here: ${main_behind}.

          To merge:

          1. \`git fetch ${UPSTREAM} main 'release/*:refs/remotes/upstream/release/*'\`, then merge upstream \`main\` (or the newest release branch if it is not on \`main\` yet) into a new branch here.
          2. Read the upstream CHANGELOG entry for the new version. Look for anything that touches \`/data\`, \`start.sh\`, the admin password, the public address variable or the pairing store, since \`dockhold/entrypoint.sh\` depends on those.
          3. Keep this starter's own README, the two Dockhold lines at the end of the \`Dockerfile\`, and the admin panel edits listed in \`dockhold/CHANGELOG.md\`. Upstream files for other hosts stay out of this repository.
          4. Push the branch; the Dockhold check builds the image and runs \`dockhold/smoke.sh\`.
          5. Test the upgrade on a populated install with a backup downloaded first.
          6. Add an entry to \`dockhold/CHANGELOG.md\`, then merge.

          This issue is updated by the weekly upstream check until everything is merged.
          BODY
          )
          gh label create upstream --description "Upstream template moved" --color 0E8A16 --force >/dev/null 2>&1 || true
          existing=$(gh issue list --state open --label upstream --search "Upstream template moved in:title" \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --title "$title" --body "$body"
            echo "updated issue #$existing"
          else
            gh issue create --title "$title" --body "$body" --label upstream
          fi
